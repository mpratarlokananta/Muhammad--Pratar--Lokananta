[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && php artisan storage:link --force"

[deploy]
preDeployCommand = "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
startCommand = "php artisan serve --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/public/projects"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
